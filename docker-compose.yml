services:
  nabapp:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NABAPP_SECRET: ${NABAPP_SECRET:?Set NABAPP_SECRET in .env}
      NABAPP_DATA_DIR: /app/data
      SESSION_DAYS: ${SESSION_DAYS:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NABAPP_SMS_PROVIDER: ${NABAPP_SMS_PROVIDER:-dev}
      NETGSM_USERCODE: ${NETGSM_USERCODE:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_HEADER: ${NETGSM_HEADER:-}
      SMS_VERIFICATION_TEMPLATE: ${SMS_VERIFICATION_TEMPLATE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_VERIFICATION_SUBJECT: ${EMAIL_VERIFICATION_SUBJECT:-}
      EMAIL_VERIFICATION_TEMPLATE: ${EMAIL_VERIFICATION_TEMPLATE:-}
    volumes:
      - nabapp-data:/app/data
    restart: unless-stopped
    init: true

volumes:
  nabapp-data:
